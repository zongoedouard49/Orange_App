name: Orange_App CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ============================================================
  # 1. TEST BACKEND
  # ============================================================
  backend:
    name: Backend - Tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.0"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier les imports Python
        run: |
          python -m compileall .

      # Si tu as pytest, décommente :
      # - name: Tests
      #   run: pytest


  # ============================================================
  # 2. TEST / BUILD FRONTEND
  # ============================================================
  frontend:
    name: Frontend - Build
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        working-directory: frontend
        run: npm ci

      - name: Linter
        working-directory: frontend
        run: npm run lint

      - name: Build Next.js
        working-directory: frontend
        run: npm run build


  # ============================================================
  # 3. DEPLOIEMENT SERVEUR
  # ============================================================
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest

    needs:
      - backend
      - frontend

    if: github.ref == 'refs/heads/main'

    steps:

      - name: Déployer sur le serveur Ubuntu
        uses: appleboy/ssh-action@v1.2.0

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}

          script: |

            set -e

            echo "======================================"
            echo "Début du déploiement Orange_App"
            echo "======================================"

            cd /home/zongo/Orange_App

            echo "1. Sauvegarde de la version actuelle"

            git rev-parse HEAD > /tmp/orange_app_previous_commit.txt

            echo "2. Récupération du nouveau code"

            git fetch origin main

            git reset --hard origin/main

            echo "3. Mise à jour du backend"

            source /home/zongo/Orange_App/.venv/bin/activate

            python -m pip install --upgrade pip

            pip install -r requirements.txt

            deactivate

            echo "4. Mise à jour du frontend"

            cd /home/zongo/Orange_App/frontend

            npm ci

            npm run build

            echo "5. Redémarrage FastAPI"

            sudo systemctl restart orange-app-api

            echo "6. Redémarrage Next.js"

            sudo systemctl restart orange-app-frontend

            echo "7. Vérification FastAPI"

            sleep 3

            systemctl is-active --quiet orange-app-api

            echo "FastAPI OK"

            echo "8. Vérification Next.js"

            systemctl is-active --quiet orange-app-frontend

            echo "Next.js OK"

            echo "======================================"
            echo "Déploiement terminé avec succès"
            echo "======================================"